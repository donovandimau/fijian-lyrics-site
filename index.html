<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fijian Lyrics</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#main">Skip to content</a><header><h1>Fijian Lyrics</h1><p>Searchable Fijian song lyrics, each with its source</p></header>
<main id="main"><label for="q">Search songs by title, artist or lyrics</label><input id="q" type="search" autocomplete="off"><p id="count" aria-live="polite"></p><ul id="list"></ul><div id="songs"></div><h2>Catalogue</h2><p>These songs link out to the sites where their lyrics are published. No lyrics are copied here.</p><div id="catalogue"></div></main>

<script src="songs.js"></script><script src="catalogue.js"></script><script src="app.js"></script></body></html>
